name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      element_ref:
        description: Element Classic iOS branch or tag to build
        required: true
        default: master
      artifact_name:
        description: Artifact name shown in GitHub Actions
        required: true
        default: Zhanyou-unsigned-ipa
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/build-ios-unsigned.yml
      - scripts/patch_element_ios.py
      - branding/zhan-you-icon-1024.png
      - README.md

permissions:
  contents: read

env:
  ELEMENT_REF: ${{ github.event.inputs.element_ref || 'master' }}
  ARTIFACT_NAME: ${{ github.event.inputs.artifact_name || 'Zhanyou-unsigned-ipa' }}
  IPA_NAME: Zhanyou-unsigned.ipa

jobs:
  build:
    name: Build unsigned IPA on macOS
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v6

      - name: Show runner tools
        run: |
          sw_vers
          xcodebuild -version
          ruby --version
          git --version
          sips --version

      - name: Configure GitHub HTTPS submodules
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --get-regexp '^url\..*\.insteadOf$'

      - name: Clone Element Classic iOS
        run: |
          git clone --depth 1 --branch "$ELEMENT_REF" https://github.com/element-hq/element-ios.git element-ios
          cd element-ios
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          git rev-parse --short HEAD

      - name: Patch Element iOS configuration
        run: |
          python3 scripts/patch_element_ios.py
          grep -n "matrix.xuyoxxx.com\|authScreenShowCustomServerOptions\|replacementApp\|roomScreenAllowVoIP" element-ios/Config/BuildSettings.swift
          grep -n "BUNDLE_DISPLAY_NAME\|BASE_BUNDLE_IDENTIFIER\|APPLICATION_GROUP_IDENTIFIER\|APPLICATION_SCHEME\|DEVELOPMENT_TEAM" element-ios/Config/AppIdentifiers.xcconfig
          find element-ios/Riot/Assets/SharedImages.xcassets/AppIcon.appiconset -maxdepth 1 -name '*.png' | sort | head

      - name: Install build tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen mint
          gem install cocoapods -v 1.16.2 --no-document

      - name: Generate Xcode project and install pods
        working-directory: element-ios
        run: |
          rm -rf Riot.xcodeproj Riot.xcworkspace Pods
          xcodegen
          COCOAPODS_DISABLE_STATS=1 pod install
          xcodebuild -list -workspace Riot.xcworkspace

      - name: Resolve Swift packages
        working-directory: element-ios
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Riot.xcworkspace \
            -scheme Riot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build unsigned app
        working-directory: element-ios
        run: |
          xcodebuild \
            -workspace Riot.xcworkspace \
            -scheme Riot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package strictly unsigned Payload-only IPA
        working-directory: element-ios
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app was produced" >&2
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" -print >&2 || true
            exit 1
          fi

          rm -rf build/Payload build/$IPA_NAME build/unsigned-clean-report.txt
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          # Third-party signers are often fragile around nested app extensions.
          # Keep the IPA Payload-only and app-only, matching the clean reference package style.
          rm -rf build/Payload/*.app/PlugIns
          rm -rf build/Payload/*.app/Watch
          rm -rf build/Payload/*.app/SC_Info

          # Remove every signing/provisioning remnant recursively.
          find build/Payload -name _CodeSignature -type d -prune -exec rm -rf {} +
          find build/Payload -name embedded.mobileprovision -type f -delete
          find build/Payload -name CodeResources -type f -delete
          find build/Payload -name '*.xcent' -type f -delete
          find build/Payload -name '*.entitlements' -type f -delete

          {
            echo "Unsigned clean report"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "App path: $APP_PATH"
            echo
            echo "Top-level IPA entries: Payload only"
            echo
            echo "Signature file remnants:"
            find build/Payload \( -name _CodeSignature -o -name embedded.mobileprovision -o -name CodeResources -o -name '*.xcent' -o -name '*.entitlements' \) -print
            echo
            echo "codesign checks:"
          } > build/unsigned-clean-report.txt

          SIGNED_FOUND=0
          while IFS= read -r bundle; do
            set +e
            codesign -dv "$bundle" >> build/unsigned-clean-report.txt 2>&1
            CODE_SIGN_STATUS=$?
            set -e
            if [ "$CODE_SIGN_STATUS" -eq 0 ]; then
              echo "SIGNED_BUNDLE: $bundle" | tee -a build/unsigned-clean-report.txt >&2
              SIGNED_FOUND=1
            else
              echo "UNSIGNED_BUNDLE_OK: $bundle" >> build/unsigned-clean-report.txt
            fi
          done < <(find build/Payload -type d \( -name '*.app' -o -name '*.framework' -o -name '*.bundle' \) | sort)

          echo >> build/unsigned-clean-report.txt
          echo "Mach-O LC_CODE_SIGNATURE checks:" >> build/unsigned-clean-report.txt
          while IFS= read -r binary; do
            if otool -l "$binary" 2>/dev/null | grep -q LC_CODE_SIGNATURE; then
              echo "SIGNED_MACHO: $binary" | tee -a build/unsigned-clean-report.txt >&2
              SIGNED_FOUND=1
            else
              echo "UNSIGNED_MACHO_OK: $binary" >> build/unsigned-clean-report.txt
            fi
          done < <(find build/Payload -type f -print0 | xargs -0 file | awk -F: '/Mach-O/ {print $1}' | sort)

          if [ "$SIGNED_FOUND" -ne 0 ]; then
            echo "A signing remnant was found. Refusing to upload." >&2
            exit 1
          fi

          if find build/Payload \( -name _CodeSignature -o -name embedded.mobileprovision -o -name CodeResources -o -name '*.xcent' -o -name '*.entitlements' \) -print -quit | grep -q .; then
            echo "Signing/provisioning files still exist. Refusing to upload." >&2
            exit 1
          fi

          cd build
          zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          cat unsigned-clean-report.txt

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            element-ios/build/${{ env.IPA_NAME }}
            element-ios/build/${{ env.IPA_NAME }}.sha256
            element-ios/build/unsigned-clean-report.txt
          if-no-files-found: error
          retention-days: 14
